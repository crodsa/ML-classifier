[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CdiffCladeML"
version = "5.4.0"
description = "Two-stage polyphasic C. difficile clade classifier (classical RF + Cryptic gate)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "CdiffCladeML contributors" },
]
keywords = ["Clostridioides difficile", "MLST", "machine learning", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2,<3",
    # The bundled joblib model was serialized with scikit-learn 1.7.1.
    # sklearn does not guarantee cross-version pickle compatibility.
    "scikit-learn==1.7.1",
    "joblib>=1.3,<2",
]

[project.scripts]
CdiffCladeML-train   = "cdiff_clademl.cli.train:main"
CdiffCladeML-predict = "cdiff_clademl.cli.predict:main"
cdiff-train          = "cdiff_clademl.cli.train:main"
cdiff-predict        = "cdiff_clademl.cli.predict:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cdiff_clademl*"]

[tool.setuptools.data-files]
"share/CdiffCladeML/models" = [
    "model_v5.joblib",
    "model_v5_model_card.json",
]

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.12,<1",
    "twine>=6,<7",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cdiff_clademl"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
