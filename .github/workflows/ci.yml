name: CI

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest ruff build twine
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m build
      - run: sha256sum dist/* > dist/SHA256SUMS
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Install and smoke-test the built wheel
        shell: bash
        run: |
          python -m pip uninstall --yes CdiffCladeML
          python -m pip install --no-deps dist/*.whl
          CdiffCladeML-predict "$GITHUB_WORKSPACE/tests/data/smoke_profiles.csv" \
            -o wheel-smoke/predictions.tsv
          test -s wheel-smoke/predictions.tsv
          test -s wheel-smoke/predictions_summary.json
          test -s wheel-smoke/report.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions-py${{ matrix.python-version }}
          path: dist/*
